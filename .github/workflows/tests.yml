name: Tests und Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Entwicklungsabhängigkeiten installieren
        run: npm ci

      - name: Unit-Tests mit Coverage ausführen
        run: npm run test:coverage

      - name: Qualität der Unit-Tests mit Mutationen prüfen
        run: npm run test:mutation
